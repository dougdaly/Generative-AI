[project]
name = "agentic-multimodal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "diskcache>=5.6",
  "structlog>=24",
  "pillow>=10",
  "numpy>=1.26",
  "matplotlib>=3.9",           # for quick previews if needed
  # generation & maps (pin to your stack):
  # "diffusers", "transformers", "torch", "accelerate", "xformers",
  # "pyproj", "shapely", "cartopy", "cairosvg",
]

[tool.setuptools.packages.find]
where = ["src"]

