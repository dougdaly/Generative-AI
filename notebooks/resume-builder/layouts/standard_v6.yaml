schema_version: standard_v6
page:
  margins:
    top: 0.45
    bottom: 0.45
    left: 0.55
    right: 0.55
fonts:
  base: Aptos
  body_size: 9
styles:
  header_name:
    bold: true
    size: 16
    align: center
    space_after: 0
  header_title:
    bold: true
    size: 10
    align: center
    space_after: 1
  header_contact:
    size: 8.5
    align: center
    space_after: 3
  section_heading:
    bold: true
    uppercase: true
    size: 10
    space_before: 5
    space_after: 1
    border_bottom: true
  body:
    size: 9
    space_after: 3
  experience_heading:
    bold: true
    size: 9
    space_before: 2
    space_after: 0
  subsection_heading:
    bold: true
    size: 8.75
    space_before: 1
    space_after: 0
  bullet:
    size: 8.75
    space_after: 0
  inline_list:
    size: 8.75
    space_after: 0
header:
  rows:
  - fields:
    - name
    style: header_name
  - fields:
    - title
    style: header_title
  - fields:
    - location
    - email
    - phone
    - linkedin
    - github
    - website
    - clearance
    separator: ' | '
    style: header_contact
formatters:
  experience_heading:
    fields:
    - role
    - organization
    - dates
    separator: ' | '
    style: experience_heading
  subsection_heading:
    fields:
    - label
    - context
    - dates
    separator: ' | '
    style: subsection_heading
    field_formats:
      context: ({value})
bullets:
  left_indent: 0.18
  hanging_indent: 0.12
types:
  paragraph:
    content_style: body
  bullet:
    content_style: bullet
  inline_list:
    content_style: inline_list
    separator: ' | '
  subsections:
    item_formatter: subsection_heading
    default_child_type: inline_list
  experience:
    item_formatter: experience_heading
    default_child_type: bullet
