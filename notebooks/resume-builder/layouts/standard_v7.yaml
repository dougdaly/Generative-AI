schema_version: standard_v7
page:
  margins:
    top: 0.45
    bottom: 0.45
    left: 0.45
    right: 0.45

fonts:
  base: Aptos
  body_size: 9
styles:
  header_name:
    bold: true
    size: 16
    align: center
    space_after: 0

  header_title:
    bold: true
    size: 10
    align: center
    space_after: 1

  header_contact:
    size: 8.5
    align: center
    space_after: 3

  section_heading:
    bold: true
    uppercase: true
    size: 10
    space_before: 5
    space_after: 1
    border_bottom: true
    keep_with_next: true

  paragraph:
    size: 9
    space_after: 3

  list_item:
    size: 8.75
    space_after: 0
    keep_together: true

  experience_heading:
    bold: true
    size: 9
    space_before: 3
    space_after: 0
    keep_with_next: true

  subsection_heading:
    bold: true
    size: 8.75
    space_before: 1.5
    space_after: 0
    keep_with_next: true