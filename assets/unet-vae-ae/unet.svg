<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="320" class="diagram" viewBox="0 0 1220 320">
  <style>
    .diagram { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 22px; fill: #111; }
    .label { font-weight: 600; font-size: 14px; fill: #111; }
    .small { font-size: 12px; fill: #444; }
    .box   { fill: #fffdf7; stroke: #1f2937; stroke-width: 1.6; rx: 10; ry: 10; }
    .boxGrey { fill: #f2f5f9; stroke: #1f2937; stroke-width: 1.6; rx: 10; ry: 10; }
    .head { fill: #eef7ff; stroke: #1f2937; stroke-width: 1.6; rx: 10; ry: 10; }
    .arrow { stroke: #1f2937; stroke-width: 1.6; fill: none; }
    .skip  { stroke: #2563eb; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    .loss  { stroke: #ef4444; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .prior { fill: #fff; stroke: #1f2937; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#1f2937" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#2563eb" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#ef4444" />
    </marker>
  </defs>
<text class="title" x="610.0" y="36" text-anchor="middle">U-Net segmentation (with skip connections)</text><rect class="box" x="40" y="96" width="120" height="56" /><text class="label" x="100" y="130" text-anchor="middle">Image in</text><rect class="box" x="210" y="96" width="250" height="56" /><text class="label" x="335" y="120" text-anchor="middle">Encoder</text><text class="small" x="335" y="140" text-anchor="middle">Down: H→H/2→H/4</text><rect class="box" x="486" y="96" width="170" height="56" /><text class="label" x="571" y="120" text-anchor="middle">Bottleneck</text><text class="small" x="571" y="140" text-anchor="middle">@ H/8 (no sampling)</text><rect class="boxGrey" x="676" y="96" width="250" height="56" /><text class="label" x="801" y="120" text-anchor="middle">Decoder</text><text class="small" x="801" y="140" text-anchor="middle">Up: H/4→H/2→H</text><rect class="head" x="946" y="96" width="130" height="56" /><text class="label" x="1011" y="120" text-anchor="middle">Head</text><text class="small" x="1011" y="140" text-anchor="middle">1×1 → logits</text><rect class="box" x="1096" y="96" width="150" height="56" /><text class="label" x="1171" y="120" text-anchor="middle">Mask out</text><text class="small" x="1171" y="140" text-anchor="middle">sigmoid(thresh)</text><line class="arrow" x1="160" y1="124" x2="210" y2="124" marker-end="url(#arrow)"/><line class="arrow" x1="460" y1="124" x2="486" y2="124" marker-end="url(#arrow)"/><line class="arrow" x1="656" y1="124" x2="676" y2="124" marker-end="url(#arrow)"/><line class="arrow" x1="926" y1="124" x2="946" y2="124" marker-end="url(#arrow)"/><line class="arrow" x1="1076" y1="124" x2="1096" y2="124" marker-end="url(#arrow)"/><line class="skip" x1="335" y1="78" x2="801" y2="78" marker-end="url(#arrowBlue)"/><text class="small" x="568" y="70" text-anchor="middle">skip (concat) at H, H/2, H/4</text><line class="loss" x1="1171" y1="188" x2="100" y2="188" marker-end="url(#arrowRed)"/><text class="small" x="650" y="176" text-anchor="middle">BCE-with-logits + Dice</text></svg>