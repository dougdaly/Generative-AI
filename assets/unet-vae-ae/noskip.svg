<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" class="diagram" viewBox="0 0 1120 300">
  <style>
    .diagram { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 22px; fill: #111; }
    .label { font-weight: 600; font-size: 14px; fill: #111; }
    .small { font-size: 12px; fill: #444; }
    .box   { fill: #fffdf7; stroke: #1f2937; stroke-width: 1.6; rx: 10; ry: 10; }
    .boxGrey { fill: #f2f5f9; stroke: #1f2937; stroke-width: 1.6; rx: 10; ry: 10; }
    .head { fill: #eef7ff; stroke: #1f2937; stroke-width: 1.6; rx: 10; ry: 10; }
    .arrow { stroke: #1f2937; stroke-width: 1.6; fill: none; }
    .skip  { stroke: #2563eb; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    .loss  { stroke: #ef4444; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .prior { fill: #fff; stroke: #1f2937; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#1f2937" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#2563eb" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#ef4444" />
    </marker>
  </defs>
<text class="title" x="560.0" y="36" text-anchor="middle">Segmentation baseline (no skips)</text><rect class="box" x="40" y="88" width="120" height="56" /><text class="label" x="100" y="122" text-anchor="middle">Image in</text><rect class="box" x="210" y="88" width="220" height="56" /><text class="label" x="320" y="112" text-anchor="middle">Encoder</text><text class="small" x="320" y="132" text-anchor="middle">Down: H→H/2→H/4</text><rect class="box" x="456" y="88" width="160" height="56" /><text class="label" x="536" y="112" text-anchor="middle">Bottleneck</text><text class="small" x="536" y="132" text-anchor="middle">@ H/8</text><rect class="boxGrey" x="640" y="88" width="220" height="56" /><text class="label" x="750" y="112" text-anchor="middle">Decoder</text><text class="small" x="750" y="132" text-anchor="middle">Up: H/4→H/2→H</text><rect class="head" x="880" y="88" width="130" height="56" /><text class="label" x="945" y="112" text-anchor="middle">Head</text><text class="small" x="945" y="132" text-anchor="middle">1×1 → logits</text><rect class="box" x="1030" y="88" width="150" height="56" /><text class="label" x="1105" y="112" text-anchor="middle">Mask out</text><text class="small" x="1105" y="132" text-anchor="middle">sigmoid(thresh)</text><line class="arrow" x1="160" y1="116" x2="210" y2="116" marker-end="url(#arrow)"/><line class="arrow" x1="430" y1="116" x2="456" y2="116" marker-end="url(#arrow)"/><line class="arrow" x1="616" y1="116" x2="640" y2="116" marker-end="url(#arrow)"/><line class="arrow" x1="860" y1="116" x2="880" y2="116" marker-end="url(#arrow)"/><line class="arrow" x1="1010" y1="116" x2="1030" y2="116" marker-end="url(#arrow)"/><line class="loss" x1="1105" y1="178" x2="100" y2="178" marker-end="url(#arrowRed)"/><text class="small" x="620" y="166" text-anchor="middle">BCE-with-logits + Dice</text></svg>