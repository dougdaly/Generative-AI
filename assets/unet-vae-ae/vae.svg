<text class="title" x="540.0" y="36" text-anchor="middle">Variational Autoencoder (VAE)</text><rect class="box" x="40" y="96" width="120" height="56" /><text class="label" x="100" y="130" text-anchor="middle">Image in</text><rect class="box" x="210" y="96" width="150" height="56" /><text class="label" x="285" y="120" text-anchor="middle">Encoder</text><text class="small" x="285" y="140" text-anchor="middle">fφ</text><rect class="box" x="392" y="76" width="110" height="40" /><text class="label" x="447" y="102" text-anchor="middle">μ(x)</text><rect class="box" x="392" y="132" width="110" height="40" /><text class="label" x="447" y="158" text-anchor="middle">log σ²(x)</text><rect class="box" x="520" y="76" width="150" height="40" /><text class="label" x="595" y="102" text-anchor="middle">reparameterize</text><rect class="box" x="520" y="132" width="150" height="40" /><text class="small" x="595" y="158" text-anchor="middle">σ = exp(0.5·logσ²)</text><rect class="box" x="696" y="96" width="90" height="56" /><text class="label" x="741" y="130" text-anchor="middle">z</text><rect class="boxGrey" x="812" y="96" width="150" height="56" /><text class="label" x="887" y="120" text-anchor="middle">Decoder</text><text class="small" x="887" y="140" text-anchor="middle">gθ</text><rect class="box" x="974" y="96" width="120" height="56" /><text class="label" x="1034" y="120" text-anchor="middle">Reconstruction</text><text class="small" x="1034" y="140" text-anchor="middle">x̂</text><circle class="prior" cx="520" cy="216" r="28"/><text class="small" x="520" y="219" text-anchor="middle">p(z)</text><text class="small" x="520" y="236" text-anchor="middle">N(0,I)</text><line class="arrow" x1="160" y1="124" x2="210" y2="124" marker-end="url(#arrow)"/><line class="arrow" x1="360" y1="96" x2="392" y2="96" marker-end="url(#arrow)"/><line class="arrow" x1="360" y1="152" x2="392" y2="152" marker-end="url(#arrow)"/><line class="arrow" x1="502" y1="96" x2="520" y2="96" marker-end="url(#arrow)"/><line class="arrow" x1="502" y1="152" x2="520" y2="152" marker-end="url(#arrow)"/><line class="arrow" x1="670" y1="124" x2="696" y2="124" marker-end="url(#arrow)"/><line class="arrow" x1="786" y1="124" x2="812" y2="124" marker-end="url(#arrow)"/><line class="arrow" x1="962" y1="124" x2="974" y2="124" marker-end="url(#arrow)"/><line class="loss" x1="1034" y1="186" x2="100" y2="186" marker-end="url(#arrowRed)"/><text class="small" x="600" y="174" text-anchor="middle">reconstruction loss</text><line class="loss" x1="447" y1="116" x2="520" y2="188" marker-end="url(#arrowRed)"/><text class="small" x="520" y="168" text-anchor="middle">KL(q(z|x)‖p(z))</text></svg>