sets:
  # Diagnosis sets (ICD families)
  - id: icd:frozen_shoulder
    kind: icd_family
    pattern: M75.0x

  - id: icd:rotator_cuff
    kind: icd_family
    pattern: M75.1x

  - id: icd:tendinitis
    kind: icd_family
    pattern: M75.2x

  - id: icd:shoulder_impingement
    kind: icd_family
    pattern: M75.4x

  - id: icd:cervicalgia
    kind: icd_family
    pattern: M54.2x

  - id: icd:diabetic_neuropathy
    kind: icd_family
    pattern: E11.4x

  # Procedure sets (CPT)
  - id: cpt:arthro_block
    kind: cpt_range
    start: 20600
    end: 20611

  - id: cpt:tendon_injection
    kind: proc_list
    members: [20550, 20551]

  - id: cpt:trigger_point
    kind: proc_list
    members: [20552, 20553]

  - id: cpt:ncs
    kind: proc_list
    members: [95900]

policies:
  - policy: cms-arthro
    payer: CMS
    title: CMS Coverage — Arthrocentesis
    proc_sets: [cpt:arthro_block]
    dx_sets:   [icd:frozen_shoulder, icd:rotator_cuff]
    notes:
      - "Append modifier 50 for bilateral procedures when both joints meet medical necessity criteria."

  - policy: cms-tendon
    payer: CMS
    title: CMS Coverage — Tendon Injection
    proc_sets: [cpt:tendon_injection]
    dx_sets:   [icd:tendinitis, icd:rotator_cuff]
    notes:
      - "Ultrasound guidance required following failure of conservative therapy."

  - policy: cms-trigger
    payer: CMS
    title: CMS Coverage — Trigger Point Injection
    proc_sets: [cpt:trigger_point]
    dx_sets:   [icd:cervicalgia]
    notes:
      - "Limit 3 sessions per rolling 12 weeks."

  - policy: cms-ncs
    payer: CMS
    title: CMS Coverage — Nerve Conduction Studies
    proc_sets: [cpt:ncs]
    dx_sets:   [icd:diabetic_neuropathy]
    notes:
      - "Prior authorization generally required unless diabetic neuropathy (E11.4x) is documented and payer criteria are met."
